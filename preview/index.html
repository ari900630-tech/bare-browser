<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0"><title>Bare Browser — גרסת Web</title>
<style>
:root{color-scheme:light;--bg:#f4f7fc;--surface:#fff;--text:#17243b;--muted:#6c7890;--line:#e0e8f3;--blue:#1769e0;--soft:#eaf2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Noto Sans Hebrew",Arial,sans-serif;min-height:100dvh}body.dark{color-scheme:dark;--bg:#101722;--surface:#192435;--text:#eef4ff;--muted:#a7b5c9;--line:#2b3a50;--blue:#72a7ff;--soft:#203653}
button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{min-height:100dvh;display:flex;flex-direction:column}.top{height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line)}.brand{font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}.logo{width:29px;height:29px;background:var(--blue);color:#fff;border-radius:9px;display:grid;place-items:center}.spacer{flex:1}.ib{border:0;background:transparent;border-radius:11px;width:38px;height:38px;font-size:19px}.ib:hover,.tool:hover,.menuitem:hover{background:var(--soft)}.tabs{display:flex;gap:6px;overflow:auto;padding:7px 10px 0;background:var(--bg);border-bottom:1px solid var(--line);min-height:43px}.tab{max-width:190px;min-width:112px;border:1px solid var(--line);border-bottom:0;background:var(--surface);border-radius:11px 11px 0 0;padding:9px 10px;display:flex;align-items:center;gap:7px;font-size:12px}.tab.active{color:var(--blue);font-weight:700}.tab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.closeTab{border:0;background:transparent;border-radius:50%;width:20px;height:20px}.toolbar{display:flex;align-items:center;gap:3px;padding:8px 9px;background:var(--surface);border-bottom:1px solid var(--line)}.tool{width:36px;height:36px;flex-shrink:0;border:0;border-radius:11px;background:transparent;font-size:18px}.address{height:39px;display:flex;align-items:center;gap:8px;flex:1;min-width:40px;padding:0 11px;background:var(--bg);border:1px solid var(--line);border-radius:22px}.address input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;direction:ltr;text-align:left}.address input:focus{outline:0}.go{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:9px 13px;font-weight:700}.layout{display:flex;flex:1;min-height:0}.drawer{width:248px;background:var(--surface);border-left:1px solid var(--line);padding:12px;display:none;flex-shrink:0}.drawer.open{display:block}.drawerhead{font-weight:800;padding:12px 10px 18px}.menuitem{width:100%;text-align:right;border:0;background:transparent;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}.menuitem .mi{width:24px;text-align:center;font-size:18px}.main{flex:1;min-width:0;padding:18px;display:flex;flex-direction:column}.view{flex:1;min-height:360px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}.home{max-width:650px;margin:0 auto;text-align:center;padding:clamp(24px,7vh,72px) 14px 30px}.biglogo{margin:0 auto 15px;width:62px;height:62px;border-radius:20px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:800}.home h1{margin:0 0 8px;font-size:25px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.searchrow{display:flex;gap:8px;margin:24px auto;max-width:540px}.searchrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:13px}.shortcuts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.shortcut{min-width:100px;padding:13px;border:1px solid var(--line);background:var(--surface);border-radius:15px}.shortcut b{display:block;font-size:22px;margin-bottom:5px}.shortcut small{display:block;color:var(--muted);font-size:11px}.page{padding:22px;max-width:760px;margin:auto}.page h2{margin-top:0}.setting{padding:15px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:space-between}.setting div:first-child{flex:1}.setting strong{display:block;font-size:14px}.setting small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.setting select,.setting input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:8px;border-radius:9px}.toggle{width:42px;height:24px;accent-color:var(--blue)}.itemrow{padding:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.itemrow div{min-width:0;flex:1}.itemrow strong,.itemrow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.itemrow small{color:var(--muted);margin-top:4px}.pill{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px}.browserframe{width:100%;height:100%;min-height:360px;border:0;background:white}.notice{margin:12px 2px 0;color:var(--muted);font-size:11px;text-align:center}.bottom{display:none;background:var(--surface);border-top:1px solid var(--line);padding:5px 10px env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 2px;font-size:11px}.bottom span{display:block;font-size:18px;margin-bottom:2px}.empty{padding:45px 12px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#17243b;color:#fff;border-radius:12px;padding:11px 16px;font-size:13px;display:none;z-index:20;max-width:90vw}
@media(max-width:650px){.brand .brandtext{display:none}.top{height:49px}.toolbar{gap:1px;padding:6px 5px}.tool{width:31px;height:34px}.go{padding:9px}.main{padding:9px}.view{border-radius:15px}.drawer{position:fixed;z-index:10;top:49px;bottom:0;right:0;width:min(82vw,290px);box-shadow:-12px 0 30px #0002}.bottom{display:flex}.tabs{min-height:40px}.tab{min-width:100px}.notice{font-size:10px}.home{padding-top:7vh}}
</style></head>
<body><div class="app">
<header class="top"><button class="ib" id="menuBtn" aria-label="תפריט">☰</button><div class="brand"><div class="logo">B</div><span class="brandtext">Bare Browser</span></div><div class="spacer"></div><button class="ib" id="themeBtn" title="ערכת נושא">◐</button><button class="ib" id="newTabBtn" title="כרטיסייה חדשה">＋</button><button class="ib" id="tabsBtn" title="כרטיסיות">▢</button></header>
<div class="tabs" id="tabs"></div>
<div class="toolbar"><button class="tool" id="backBtn" title="חזרה">‹</button><button class="tool" id="forwardBtn" title="קדימה">›</button><button class="tool" id="reloadBtn" title="רענון">↻</button><div class="address"><span>⌕</span><input id="addressInput" placeholder="חיפוש או כתובת אתר" autocomplete="off" spellcheck="false"></div><button class="go" id="goBtn">מעבר</button><button class="tool" id="moreBtn" title="אפשרויות">⋮</button></div>
<div class="layout"><aside class="drawer" id="drawer"><div class="drawerhead">Bare Browser</div><button class="menuitem" data-view="home"><span class="mi">⌂</span>דף הבית</button><button class="menuitem" data-view="bookmarks"><span class="mi">☆</span>סימניות</button><button class="menuitem" data-view="history"><span class="mi">◷</span>היסטוריה</button><button class="menuitem" data-view="downloads"><span class="mi">↓</span>הורדות</button><button class="menuitem" data-view="settings"><span class="mi">⚙</span>הגדרות</button><button class="menuitem" data-action="bookmark"><span class="mi">＋</span>הוסף סימנייה לדף הנוכחי</button><button class="menuitem" data-action="external"><span class="mi">↗</span>פתח כתובת בדפדפן המכשיר</button></aside><main class="main"><section class="view" id="view"></section></main></div>
<nav class="bottom"><button data-view="home"><span>⌂</span>בית</button><button id="bottomBack"><span>‹</span>חזרה</button><button id="bottomNew"><span>＋</span>כרטיסייה</button><button data-view="bookmarks"><span>☆</span>סימניות</button><button data-view="settings"><span>⚙</span>הגדרות</button></nav>
<div class="notice">גרסת Web אינטראקטיבית לממשק Bare. חלק מהאתרים חוסמים הצגה בתוך אתר אחר; במקרה כזה אפשר לפתוח אותם בדפדפן המכשיר. אין כאן את מנוע Chromium של אפליקציית Android.</div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
let tabs=[{id:1,title:'כרטיסייה חדשה',url:'',view:'home',history:[],pos:-1}],active=1,nextId=2;
const key='bare-web-settings-v1';let settings={theme:'light',homepage:'home',search:'https://duckduckgo.com/?q=',openNew:true};try{settings={...settings,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{};if(settings.theme==='dark')document.body.classList.add('dark');
const read=(k,d=[])=>{try{return JSON.parse(localStorage.getItem('bare-'+k)||JSON.stringify(d))}catch{return d}};const write=(k,v)=>localStorage.setItem('bare-'+k,JSON.stringify(v));
function tab(){return tabs.find(t=>t.id===active)||tabs[0]}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',2400)}
function renderTabs(){$('#tabs').innerHTML=tabs.map(t=>'<button class="tab '+(t.id===active?'active':'')+'" data-tab="'+t.id+'"><span>'+(esc(t.title||'כרטיסייה חדשה'))+'</span><button class="closeTab" data-close="'+t.id+'" aria-label="סגור">×</button></button>').join('')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setAddress(){const t=tab();$('#addressInput').value=t.url||''}
function newTab(url=''){const t={id:nextId++,title:'כרטיסייה חדשה',url:'',view:'home',history:[],pos:-1};tabs.push(t);active=t.id;if(url)navigate(url);else render();$('#drawer').classList.remove('open')}
function render(){renderTabs();setAddress();const t=tab();if(t.view==='home')home();else if(t.view==='settings')settingsPage();else if(t.view==='bookmarks')listPage('bookmarks');else if(t.view==='history')listPage('history');else if(t.view==='downloads')downloadsPage();else if(t.view==='tabs')tabsPage();else if(t.view==='web')webPage();else home()}
function home(){$('#view').innerHTML='<div class="home"><div class="biglogo">B</div><h1>Bare Browser</h1><p class="muted">גלישה, חיפוש וניהול כרטיסיות</p><form class="searchrow" id="homeSearch"><input id="homeQuery" placeholder="חיפוש או הזנת כתובת" aria-label="חיפוש"><button class="go">חיפוש</button></form><div class="shortcuts"><button class="shortcut" data-url="https://duckduckgo.com"><b>🦆</b>DuckDuckGo<small>חיפוש</small></button><button class="shortcut" data-url="https://github.com/ari900630-tech/bare-browser"><b>⌘</b>GitHub<small>קוד הפרויקט</small></button><button class="shortcut" data-view="bookmarks"><b>☆</b>סימניות<small>שמורים</small></button><button class="shortcut" data-view="history"><b>◷</b>היסטוריה<small>אתרים קודמים</small></button></div></div>';$('#homeSearch').addEventListener('submit',e=>{e.preventDefault();navigate($('#homeQuery').value)});$$('[data-url]').forEach(b=>b.onclick=()=>navigate(b.dataset.url));$$('[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view))}
function normalize(s){s=s.trim();if(!s)return '';if(/^https?:\/\//i.test(s))return s;if(s.includes(' ')||!s.includes('.')&&!s.includes(':'))return settings.search+encodeURIComponent(s);return 'https://'+s}
function navigate(value){const url=normalize(value);if(!url)return;const t=tab();t.url=url;t.title=url.replace(/^https?:\/\//,'').split('/')[0];t.view='web';t.history=t.history||[];t.history=t.history.slice(0,t.pos+1);t.history.push(url);t.pos=t.history.length-1;write('history',[{url,title:t.title,time:new Date().toLocaleString('he-IL')},...read('history',[]).filter(x=>x.url!==url)].slice(0,150));render();try{$('#frame').src=url}catch{}}
function webPage(){const t=tab();$('#view').innerHTML='<div style="height:100%;min-height:360px;display:flex;flex-direction:column"><div style="padding:10px 14px;background:var(--soft);font-size:12px;line-height:1.6">האתר המבוקש נפתח באזור התצוגה אם הוא מאפשר הטמעה. אם לא נטען, לחץ על „פתח בדפדפן המכשיר”.<div style="margin-top:7px;display:flex;gap:8px;flex-wrap:wrap"><button class="go" id="openExternal">פתח בדפדפן המכשיר ↗</button><button class="pill" id="saveBookmark">☆ שמור סימנייה</button></div></div><iframe class="browserframe" id="frame" title="תוכן אתר" referrerpolicy="no-referrer"></iframe></div>';$('#frame').src=t.url;$('#openExternal').onclick=()=>window.open(t.url,'_blank','noopener');$('#saveBookmark').onclick=bookmark}
function showView(v){tab().view=v;$('#drawer').classList.remove('open');render()}
function bookmark(){const t=tab();if(!t.url){toast('פתח אתר לפני הוספת סימנייה');return}let a=read('bookmarks',[]);if(!a.some(x=>x.url===t.url))a.unshift({url:t.url,title:t.title});write('bookmarks',a);toast('הסימנייה נשמרה במכשיר');$('#drawer').classList.remove('open')}
function listPage(type){const items=read(type,[]);$('#view').innerHTML='<div class="page"><h2>'+(type==='bookmarks'?'סימניות':'היסטוריה')+'</h2><p class="muted">'+(type==='bookmarks'?'כתובות ששמרת במכשיר':'האתרים האחרונים שפתחת בגרסת האתר')+'</p>'+(items.length?items.map((x,i)=>'<div class="itemrow"><div><strong>'+esc(x.title||x.url)+'</strong><small>'+esc(x.url)+(x.time?' · '+esc(x.time):'')+'</small></div><button class="pill" data-open="'+esc(x.url)+'">פתח</button>'+(type==='bookmarks'?'<button class="pill" data-remove="'+i+'">הסר</button>':'')+'</div>').join(''):'<div class="empty">אין עדיין פריטים להצגה</div>')+'<p><button class="pill" id="clearList">נקה '+(type==='bookmarks'?'סימניות':'היסטוריה')+'</button></p></div>';$$('[data-open]').forEach(b=>b.onclick=()=>navigate(b.dataset.open));$$('[data-remove]').forEach(b=>b.onclick=()=>{let a=read('bookmarks',[]);a.splice(+b.dataset.remove,1);write('bookmarks',a);listPage('bookmarks')});$('#clearList').onclick=()=>{write(type,[]);listPage(type)}}
function settingsPage(){$('#view').innerHTML='<div class="page"><h2>הגדרות</h2><p class="muted">ההעדפות נשמרות בדפדפן הזה במכשיר.</p><div class="setting"><div><strong>ערכת נושא</strong><small>בהיר או כהה</small></div><select id="themeSelect"><option value="light" '+(settings.theme==='light'?'selected':'')+'>בהירה</option><option value="dark" '+(settings.theme==='dark'?'selected':'')+'>כהה</option></select></div><div class="setting"><div><strong>מנוע חיפוש</strong><small>כתובת החיפוש שמשמשת כשמקלידים מילות חיפוש</small></div><select id="searchSelect"><option value="https://duckduckgo.com/?q=">DuckDuckGo</option><option value="https://www.google.com/search?q=">Google</option><option value="https://www.bing.com/search?q=">Bing</option></select></div><div class="setting"><div><strong>שמור היסטוריה</strong><small>היסטוריה מקומית של האתרים שנפתחו בגרסת Web</small></div><input id="historyToggle" type="checkbox" class="toggle" checked></div><div class="setting"><div><strong>נקה נתונים מקומיים</strong><small>הסרת סימניות והיסטוריה שנשמרו באתר</small></div><button class="pill" id="clearData">נקה</button></div><p class="muted">ההגדרות כאן אינן משנות את ההגדרות באפליקציית Android.</p></div>';$('#searchSelect').value=settings.search;$('#themeSelect').onchange=e=>{settings.theme=e.target.value;saveSettings();document.body.classList.toggle('dark',settings.theme==='dark')};$('#searchSelect').onchange=e=>{settings.search=e.target.value;saveSettings()};$('#historyToggle').checked=read('saveHistory',[true])[0];$('#historyToggle').onchange=e=>write('saveHistory',[e.target.checked]);$('#clearData').onclick=()=>{write('history',[]);write('bookmarks',[]);toast('הנתונים המקומיים נמחקו')}}
function saveSettings(){localStorage.setItem(key,JSON.stringify(settings))}
function downloadsPage(){$('#view').innerHTML='<div class="page"><h2>הורדות</h2><div class="empty">הורדות שמתחילות באתר הזה מנוהלות על ידי הדפדפן של המכשיר. רשימת ההורדות של אפליקציית Android אינה זמינה באתר.</div></div>'}
function tabsPage(){$('#view').innerHTML='<div class="page"><h2>כרטיסיות פתוחות</h2>'+tabs.map(t=>'<div class="itemrow"><div><strong>'+esc(t.title)+'</strong><small>'+esc(t.url||'כרטיסייה חדשה')+'</small></div><button class="pill" data-switch="'+t.id+'">עבור</button><button class="pill" data-close="'+t.id+'">סגור</button></div>').join('')+'<p><button class="go" id="newFromTabs">＋ כרטיסייה חדשה</button></p></div>';$$('[data-switch]').forEach(b=>b.onclick=()=>{active=+b.dataset.switch;render()});$$('[data-close]').forEach(b=>b.onclick=()=>closeTab(+b.dataset.close));$('#newFromTabs').onclick=()=>newTab()}
function closeTab(id){if(tabs.length===1){tabs=[{id:nextId++,title:'כרטיסייה חדשה',url:'',view:'home',history:[],pos:-1}];active=tabs[0].id}else{tabs=tabs.filter(t=>t.id!==id);if(active===id)active=tabs[tabs.length-1].id}render()}
$('#menuBtn').onclick=()=>$('#drawer').classList.toggle('open');$('#themeBtn').onclick=()=>{settings.theme=settings.theme==='dark'?'light':'dark';saveSettings();document.body.classList.toggle('dark',settings.theme==='dark')};$('#newTabBtn').onclick=()=>newTab();$('#bottomNew').onclick=()=>newTab();$('#tabsBtn').onclick=()=>showView('tabs');$('#moreBtn').onclick=()=>$('#drawer').classList.toggle('open');$('#goBtn').onclick=()=>navigate($('#addressInput').value);$('#addressInput').addEventListener('keydown',e=>{if(e.key==='Enter')navigate($('#addressInput').value)});$('#reloadBtn').onclick=()=>{if(tab().url&&tab().view==='web'){$('#frame')?.contentWindow?.location?.reload?.()}else render()};$('#backBtn').onclick=$('#bottomBack').onclick=()=>{const t=tab();if(t.pos>0){t.pos--;t.url=t.history[t.pos];t.view='web';render()}else toast('אין דף קודם')};$('#forwardBtn').onclick=()=>{const t=tab();if(t.pos<t.history.length-1){t.pos++;t.url=t.history[t.pos];t.view='web';render()}else toast('אין דף הבא')};$$('[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));$$('[data-action="bookmark"]').forEach(b=>b.onclick=bookmark);$$('[data-action="external"]').forEach(b=>b.onclick=()=>{if(tab().url)window.open(tab().url,'_blank','noopener');else toast('הזן כתובת תחילה')});$('#tabs').addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){e.stopPropagation();closeTab(+close.dataset.close);return}const b=e.target.closest('[data-tab]');if(b){active=+b.dataset.tab;render()}});$('#tabs').addEventListener('click',e=>{if(e.target.closest('.closeTab')){const b=e.target.closest('.tab');if(b)closeTab(+b.dataset.tab)}});render();
</script></body></html>
